<div class="text-center" [class.is-self]="isSelf()">
  <div
    class="table-card mx-auto"
    [class.is-revealed]="status() === 'revealed'"
    [class.pending-pulse]="status() === 'voting' && !participant().hasVoted"
    [style.animation-delay.ms]="delayMs()"
  >
    <div class="table-card-inner">
      <div class="poker-back"></div>
      <div class="poker-face">
        @if (estimate(); as est) {
          <span class="face-hours">{{ est.hoursLabel }}</span>
          @if (est.daysLabel) {
            <span class="face-days">{{ est.daysLabel }}</span>
          }
        } @else {
          –
        }
      </div>
    </div>
  </div>
  <p
    class="seat-name"
    [attr.data-full-name]="participant().name"
    [title]="participant().name"
  >
    {{ participant().name }}
  </p>
  @if (isSelf()) {
    <p class="you-tag">You</p>
  }
  <p class="text-[0.65rem] text-mist/60">
    @if (status() === 'revealed') {
      Revealed
    } @else if (participant().hasVoted) {
      Voted
    } @else {
      Yet to vote
    }
  </p>
  @if (canRemove()) {
    <button class="mt-1 text-[0.65rem] text-mist/70 underline hover:text-gold" type="button" (click)="remove.emit()">
      Remove
    </button>
  }
</div>
