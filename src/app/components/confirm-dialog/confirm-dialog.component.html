@if (confirm.open() && confirm.options(); as options) {
  <div
    class="fixed inset-0 z-50 grid place-items-center bg-black/60 p-4 backdrop-blur-sm"
    (click)="confirm.close(false)"
  >
    <div
      class="rise-in w-full max-w-lg rounded-3xl border border-white/10 bg-ink p-7 shadow-2xl"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="'confirm-title'"
      (click)="$event.stopPropagation()"
    >
      <p class="text-xs uppercase tracking-[0.18em] text-gold">Please confirm</p>
      <h2 id="confirm-title" class="font-display mt-2 text-3xl">{{ options.title }}</h2>
      <p class="mt-3 text-sm leading-6 text-mist/80">{{ options.message }}</p>
      @if (options.items?.length) {
        <div class="mt-4 max-h-44 overflow-y-auto rounded-2xl border border-white/10 bg-white/5 p-3">
          <div class="flex flex-wrap gap-2">
            @for (name of options.items; track name) {
              <span class="name-chip">{{ name }}</span>
            }
          </div>
        </div>
      }
      <div class="mt-7 flex flex-wrap justify-end gap-2">
        <button class="btn btn-ghost" type="button" (click)="confirm.close(false)">
          {{ options.cancelLabel }}
        </button>
        <button
          class="btn"
          [class.btn-gold]="!options.danger"
          [class.btn-danger]="options.danger"
          type="button"
          (click)="confirm.close(true)"
        >
          {{ options.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
