<button
  type="button"
  class="poker-card"
  [class.is-selected]="selected()"
  [class.is-disabled]="disabled()"
  [disabled]="disabled()"
  (click)="onPick()"
>
  <span class="poker-value">{{ value() }}</span>
  @if (selected()) {
    <span class="poker-tick" aria-hidden="true">✓</span>
  }
</button>
