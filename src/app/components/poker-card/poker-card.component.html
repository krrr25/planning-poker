<button
  type="button"
  class="poker-card"
  [class.is-selected]="selected()"
  [class.is-disabled]="disabled()"
  [disabled]="disabled()"
  (click)="onPick()"
>
  @if (estimate(); as est) {
    <span class="poker-value">{{ est.hoursLabel }}</span>
    @if (est.daysLabel) {
      <span class="poker-days">{{ est.daysLabel }}</span>
    }
  }
  @if (selected()) {
    <span class="poker-tick" aria-hidden="true">✓</span>
  }
</button>
